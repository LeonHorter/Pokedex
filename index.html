<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="icon" href="./assets/icons/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/font.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="contentWrapper">
        <div class="logoBox">
            <img src="./assets/icons/logo.svg" class="logoImg" alt="Pokedex-Logo">
            <h1>Pokédex</h1>
        </div>
        <input type="text" id="searchInput" placeholder="Search" data-id="search-input">
    </header>

    <main class="contentWrapper" data-id="content">
        <ul id="pokemonList">
            <li>
                <button class="pokemonCard" data-id="card" onclick="openDialog(this)">
                    <h2>Bulbasaur</h2>
                    <p>Grass</p>
                    <p>Poison</p>
                    <p>#001</p>
                </button>
            </li>
        </ul>
        <button id="loadMoreBtn" class="basicBtn" data-id="load-more-button">Load more</button>
    </main>

    <dialog id="pokemonOverlay" onclick="closeDialog()">
        <div onclick="stopPropagation(event)">
            <header>
                <h2>Bulbasaur</h2>
                <p>Grass</p>
                <p>Poison</p>
                <p>#001</p>
            </header>
            <section>
                <ul>
                    <li>About</li>
                    <li>Base Stats</li>
                    <li>Evolution</li>
                    <li>Moves</li>
                </ul>
                <table>
                    <tr>
                        <th>Species</th>
                        <td>Seed</td>
                    </tr>
                    <tr>
                        <th>Height</th>
                        <td>2'3.6"</td>
                    </tr>
                    <tr>
                        <th>Weight</th>
                        <td>15.2 lbs</td>
                    </tr>
                    <tr>
                        <th>Abilities</th>
                        <td>Overgrow, Chlorophyl</td>
                    </tr>
                </table>
                <h3>Breeding</h3>
                <table>
                    <tr>
                        <th>Gender</th>
                        <td>87,5 %</td>
                    </tr>
                    <tr>
                        <th>Egg Groups</th>
                        <td>Monster</td>
                    </tr>
                    <tr>
                        <th>Egg Cycle</th>
                        <td>Grass</td>
                    </tr>
                </table>
            </section>
            <footer>
                <input type="image" aria-label="previous Pokémon" class="" src="" tabindex="0" onclick="showPrevImage()">
                <input type="image" aria-label="next Pokémon" class="" src="" tabindex="0" onclick="showNextImage()">
            </footer>
        </div>
    </dialog>
</body>
</html>
