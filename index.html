<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="icon" href="./assets/icons/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/font.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/colors.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
</head>
<body onload="loadPokemonData()">
    <header class="mainHeader contentWrapper">
        <a href="index.html" class="logoBox">
            <img src="./assets/icons/logo.svg" class="logoImg" alt="Pokedex-Logo">
            <h1>Pokédex</h1>
        </a>
        <input type="text" id="searchInput" placeholder="Search" data-id="search-input">
    </header>

    <main class="mainContent contentWrapper" data-id="content">
        <ul id="pokemonList">
        </ul>
        <button id="loadMoreBtn" class="basicBtn" onclick="loadCards(30)" data-id="load-more-button">Load more</button>
    </main>

    <dialog id="pokemonOverlay" onclick="closeDialog()">
    </dialog>
</body>
</html>
